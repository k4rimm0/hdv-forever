<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HDV Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=ef9f43762b">
</head>
<body>
<div id="lock" class="lock">
  <form id="lockForm" class="lock-card">
    <div class="brand big">HDV Forever</div>
    <p id="lockText"></p>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox" checked> <span id="rememberText"></span></label>
    <button type="submit" id="lockBtn"></button>
    <p id="lockErr" class="err"></p>
  </form>
</div>
<header class="top">
  <a href="#/" class="brand">HDV Forever</a>
  <nav id="nav"></nav>
  <div class="tools">
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off">
      <div id="suggest" class="suggest"></div>
    </div>
    <button id="langBtn" class="chip small"></button>
  </div>
</header>
<div id="housebar" class="housebar"></div>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<div id="tip" class="tip"></div>
<script src="app.js?v=ef9f43762b"></script>
</body>
</html>
