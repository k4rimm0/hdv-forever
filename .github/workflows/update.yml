name: Mise a jour des prix

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "collector/**", "data/**", "config.json"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Code du site
        uses: actions/checkout@v4

      - name: Donnees precedentes (branche gh-pages)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: public

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install requests cryptography

      - name: Collecte des prix
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          HOUSE_IDS: ${{ vars.HOUSE_IDS }}
        run: |
          mkdir -p public
          rm -rf public/.git
          python collector/collect.py --out public

      - name: Publication
        run: |
          cp site/* public/
          touch public/.nojekyll
          cd public
          git init -q
          git checkout -q -b gh-pages
          git config user.name "hdv-bot"
          git config user.email "hdv-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Prix du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
