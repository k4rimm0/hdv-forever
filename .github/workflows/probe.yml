name: Diagnostic recettes
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: public }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests cryptography
      - env: { SITE_PASSWORD: "${{ secrets.SITE_PASSWORD }}" }
        run: python tools/probe/probe.py
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe_out, retention-days: 2 }
