name: Diagnostic equipement
on: { workflow_dispatch: { inputs: { script: { default: dataprobe.py } } } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: public }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests cryptography
      - env: { SITE_PASSWORD: "${{ secrets.SITE_PASSWORD }}" }
        run: python tools/probe/${{ inputs.script || 'dataprobe.py' }}
      - run: |
          mkdir pb && mv probe.enc pb/ && cd pb && git init -q && git checkout -q -b probe
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
